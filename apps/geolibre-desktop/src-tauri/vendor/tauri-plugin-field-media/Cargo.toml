[package]
name = "tauri-plugin-field-media"
version = "0.1.0"
edition = "2021"
links = "tauri-plugin-field-media"

[lib]
name = "tauri_plugin_field_media"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", default-features = false, features = ["wry"] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
